# Blueprint do Render: 1 Web Service (API + frontend) que usa um PostgreSQL JÁ EXISTENTE.
# (No plano gratuito o Render só permite 1 banco; este sistema fica isolado no schema
#  "dashboard_financeiro", sem tocar nas tabelas de outros sistemas do mesmo banco.)
# Render → New → Blueprint → selecione este repositório → informe DATABASE_URL e a senha inicial.
services:
  - type: web
    name: dashboard-financeiro
    runtime: node
    plan: free            # starter recomendado para não "dormir"
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false       # cole a "Internal Database URL" do banco que você já tem no Render
      - key: DATABASE_SCHEMA
        value: dashboard_financeiro
      - key: DATABASE_SSL
        value: auto
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN_HOURS
        value: "12"
      - key: APP_TIMEZONE
        value: America/Sao_Paulo
      - key: INITIAL_ADMIN_USERNAME
        value: mlf
      - key: INITIAL_ADMIN_PASSWORD
        sync: false       # o Render pede o valor ao criar o Blueprint (use 0080 e troque no 1º acesso)
      - key: SEED_DEMO
        value: "false"
      - key: LOG_LEVEL
        value: info
